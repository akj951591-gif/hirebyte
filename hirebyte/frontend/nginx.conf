# Serves the built SPA and proxies /api (including the Socket.IO WebSocket) to the Node API.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Resume uploads are limited to 5 MB by the API.
  client_max_body_size 10m;

  # Docker's DNS: look the API up again after its container is recreated (a fixed upstream would not).
  resolver 127.0.0.11 valid=10s;

  location /api/ {
    set $api_upstream http://api:4000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    # AI question generation and evaluation calls can take a while.
    proxy_read_timeout 120s;
  }

  # Vite puts hashed, never-changing files here.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes (e.g. /candidate/login) all load index.html.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
