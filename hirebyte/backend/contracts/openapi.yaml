components:
  securitySchemes:
    recruiterSession:
      type: apiKey
      in: cookie
      name: hb_session
      description: HttpOnly session cookie set by POST /auth/recruiter/login.
    candidateSession:
      type: apiKey
      in: cookie
      name: hb_candidate
      description: HttpOnly, interview-scoped cookie set by POST /candidate/access (path /api).
    livekitSignature:
      type: apiKey
      in: header
      name: Authorization
      description: JWT signed with the LiveKit API secret, containing a sha256 of the raw body.
  schemas:
    UserRole:
      type: string
      enum:
        - RECRUITER
        - ADMIN
      description: |-
        HIREBYTE API CONTRACT TYPES (provisional, PRD v2.1 §11).

        Canonical file: backend/contracts/api-types.ts. A byte-identical copy lives in frontend/src/api/generated/contract.ts; backend test `contract.sync.test.ts` fails if they differ. Change the canonical file, then copy it to the frontend (`npm run sync:contract` in frontend). backend/contracts/openapi.yaml should be generated from / kept equivalent to these types.
    InterviewStatus:
      type: string
      enum:
        - DRAFT
        - READY
        - ONBOARDING
        - IN_PROGRESS
        - PROCESSING_ANSWER
        - COMPLETED
        - EVALUATING
        - EVALUATED
        - EVALUATION_FAILED
        - REVIEWED
        - CANCELLED
    RecordingStatus:
      type: string
      enum:
        - NOT_ENABLED
        - PENDING
        - RECORDING
        - FINALIZING
        - READY
        - FAILED
        - DELETED
    Difficulty:
      type: string
      enum:
        - EASY
        - MEDIUM
        - HARD
    ExperienceLevel:
      type: string
      enum:
        - INTERN
        - JUNIOR
        - MID
        - SENIOR
        - LEAD
    QuestionCategory:
      type: string
      enum:
        - TECHNICAL
        - BEHAVIORAL
        - SITUATIONAL
        - RESUME
        - SYSTEM_DESIGN
    QuestionSource:
      type: string
      enum:
        - AI_GENERATED
        - RECRUITER
        - FOLLOW_UP
    AnswerStatus:
      type: string
      enum:
        - ANSWERED
        - SKIPPED
        - UNANSWERED
    AnswerInputMode:
      type: string
      enum:
        - VOICE
        - TEXT
    SecondaryCameraPolicy:
      type: string
      enum:
        - OFF
        - OPTIONAL
        - REQUIRED
    ExtractionStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED
    EvaluationStatus:
      type: string
      enum:
        - NOT_STARTED
        - EVALUATING
        - EVALUATED
        - FAILED
    EvaluationReviewStatus:
      type: string
      enum:
        - AI_ONLY
        - CONFIRMED
        - OVERRIDDEN
    CameraSource:
      type: string
      enum:
        - PRIMARY
        - SECONDARY
    MediaConnectionStatus:
      type: string
      enum:
        - NOT_CONNECTED
        - CONNECTING
        - CONNECTED
        - DISCONNECTED
    PairingStatus:
      type: string
      enum:
        - NOT_PAIRED
        - PAIRED
        - DISCONNECTED
        - EXPIRED
    ProctoringEventType:
      type: string
      enum:
        - FACE_ABSENT
        - MULTIPLE_FACES
        - LOOKING_AWAY
        - TAB_HIDDEN
        - SECONDARY_CONNECTED
        - SECONDARY_DISCONNECTED
        - AUDIO_ISSUE
    ProctoringReviewStatus:
      type: string
      enum:
        - UNREVIEWED
        - NO_CONCERN
        - NEEDS_FOLLOW_UP
      description: Observation review state. Events are for human review, never a cheating verdict (PRD §13).
    ApiErrorCode:
      type: string
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - RATE_LIMITED
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - INVITATION_INVALID
        - INVITATION_EXPIRED
        - INTERVIEW_COMPLETED
        - SESSION_LOCKED
        - SESSION_EXPIRED
        - CONSENT_REQUIRED
        - SECONDARY_CAMERA_REQUIRED
        - SKIP_NOT_ALLOWED
        - DUPLICATE_SUBMISSION
        - RESUME_UNSUPPORTED
        - RESUME_UNREADABLE
        - PROVIDER_UNAVAILABLE
        - PROVIDER_TIMEOUT
        - MEDIA_NOT_CONFIGURED
        - RECORDING_NOT_READY
        - RECORDING_UNAVAILABLE
        - RECORDING_DELETED
        - RECORDING_DELETE_FAILED
        - SERVICE_UNAVAILABLE
        - INTERNAL_ERROR
      description: Error codes the UI branches on. Unknown codes fall back to the generic error message.
    ApiErrorBody:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              anyOf:
                - $ref: "#/components/schemas/ApiErrorCode"
                - type: string
            message:
              type: string
            requestId:
              type: string
            details:
              type: object
              additionalProperties: {}
          required:
            - code
            - message
      required:
        - error
      description: PRD §11.1 standard error body.
    SafeUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
      required:
        - id
        - email
        - name
        - role
    RecruiterLoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
        - email
        - password
    RecruiterLoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SafeUser"
      required:
        - user
      description: Session is carried by an HttpOnly cookie; the body only echoes the safe identity.
    MeResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/SafeUser"
      required:
        - user
    InterviewConfig:
      type: object
      properties:
        questionCount:
          type: number
          description: Backend defaults to 10 when omitted (PRD §19).
        durationMinutes:
          type: number
        difficulty:
          $ref: "#/components/schemas/Difficulty"
        experienceLevel:
          $ref: "#/components/schemas/ExperienceLevel"
        categories:
          type: array
          items:
            $ref: "#/components/schemas/QuestionCategory"
        allowSkip:
          type: boolean
        allowFollowUps:
          type: boolean
        maxFollowUps:
          type: number
        secondaryCamera:
          $ref: "#/components/schemas/SecondaryCameraPolicy"
        recordingEnabled:
          type: boolean
          description: Requested by the recruiter; the server still applies RECORDING_ENABLED policy.
      required:
        - questionCount
        - durationMinutes
        - difficulty
        - experienceLevel
        - categories
        - allowSkip
        - allowFollowUps
        - maxFollowUps
        - secondaryCamera
        - recordingEnabled
    InterviewProgress:
      type: object
      properties:
        answered:
          type: number
        skipped:
          type: number
        total:
          type: number
        currentSequence:
          type:
            - number
